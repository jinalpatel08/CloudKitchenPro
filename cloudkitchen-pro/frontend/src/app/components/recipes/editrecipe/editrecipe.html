<div class="container mt-5">
  <h2>Edit Recipe</h2>

  <div *ngIf="message" class="alert alert-danger">{{ message }}</div>

  <form (ngSubmit)="submit()">
    <div class="mb-3">
      <label class="form-label">Title</label>
      <input class="form-control" [(ngModel)]="recipeData.title" name="title" required />
    </div>

    <div class="mb-3">
      <label class="form-label">Chef</label>
      <input class="form-control" [(ngModel)]="recipeData.chef" name="chef" required />
    </div>

    <div class="mb-3">
      <label class="form-label">Ingredients</label>
      <textarea class="form-control" [(ngModel)]="recipeData.ingredients" name="ingredients"></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Instructions</label>
      <textarea class="form-control" [(ngModel)]="recipeData.instructions" name="instructions"></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Meal Type</label>
      <select class="form-select" [(ngModel)]="recipeData.mealType" name="mealType">
        <option>Breakfast</option>
        <option>Lunch</option>
        <option>Dinner</option>
        <option>Snack</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Cuisine Type</label>
      <select class="form-select" [(ngModel)]="recipeData.cuisineType" name="cuisineType">
        <option>Indian</option>
        <option>Italian</option>
        <option>Chinese</option>
        <option>Mexican</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Prep Time (mins)</label>
      <input type="number" class="form-control" [(ngModel)]="recipeData.prepTime" name="prepTime" />
    </div>

    <div class="mb-3">
      <label class="form-label">Difficulty</label>
      <select class="form-select" [(ngModel)]="recipeData.difficulty" name="difficulty">
        <option>Easy</option>
        <option>Medium</option>
        <option>Hard</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Servings</label>
      <input type="number" class="form-control" [(ngModel)]="recipeData.servings" name="servings" />
    </div>

    <button type="submit" class="btn btn-success">Update Recipe</button>
  </form>
</div>
