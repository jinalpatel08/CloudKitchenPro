<div *ngIf="recipe; else loadingOrError">
  <h2>{{ recipe.title }}</h2>
  <p><strong>Ingredients:</strong> {{ recipe.ingredients?.join(', ') }}</p>
  <p><strong>Instructions:</strong></p>
  <ul>
    <li *ngFor="let step of recipe.instructions">{{ step }}</li>
  </ul>

  <button *ngIf="!analysisResult && !loading" class="btn btn-info" (click)="onAnalyseClick()">
    Analyse Health
  </button>

  <div *ngIf="loading" class="mt-3 alert alert-info">Analysing...</div>

  <div *ngIf="analysisResult" class="mt-3 card border-primary">
    <div class="card-header">Health Analysis</div>
    <div class="card-body">
      <pre>{{ analysisResult }}</pre>
    </div>
  </div>

  <div *ngIf="error" class="alert alert-danger mt-3">{{ error }}</div>
</div>

<ng-template #loadingOrError>
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
  <div *ngIf="!error" class="alert alert-secondary">Loading recipe...</div>
</ng-template>
