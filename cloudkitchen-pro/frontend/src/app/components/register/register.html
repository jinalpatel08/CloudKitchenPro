<div class="card p-4 mx-auto" style="max-width: 500px">
  <h2 class="text-center">Register</h2>
  @if (message) {
    <div class="alert alert-info">{{ message }}</div>
  }
  <form (ngSubmit)="submit()">
    <div class="mb-3">
      <label>Email</label>
      <input type="email" class="form-control" [(ngModel)]="user.email" name="email" required />
    </div>
    <div class="mb-3">
      <label>Password</label>
      <input type="password" class="form-control" [(ngModel)]="user.password" name="password" required />
    </div>
    <div class="mb-3">
      <label>Full Name</label>
      <input class="form-control" [(ngModel)]="user.fullname" name="fullname" required />
    </div>
    <div class="mb-3">
      <label>Role</label>
      <select class="form-select" [(ngModel)]="user.role" name="role" required>
        <option value="admin">Admin</option>
        <option value="chef">Chef</option>
        <option value="manager">Manager</option>
      </select>
    </div>
    <div class="mb-3">
      <label>Phone</label>
      <input class="form-control" [(ngModel)]="user.phone" name="phone" required />
    </div>

    <button type="submit" class="btn btn-success w-100">Register</button>
  </form>

  <p class="mt-3 text-center">
    Already have an account? <a href="/login">Login here</a>
  </p>
</div>
